name: Feature request
description: Propose an improvement to a scientific or developer workflow.
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow and problem
      description: What are you trying to accomplish, and what is missing today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the intended behavior and an example. For a new scientific capability, include how its results could be independently checked.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and dependencies
      description: List current workarounds and relevant public libraries or tools.
